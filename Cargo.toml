[package]
name = "mstd-wsj-rss"
authors = ["Seungjin Kim <seungjin@duck.com>"]
description = "WSI RSS bot for Mastodon"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
rss = "2.0"
chrono = "0.4.40"
chrono-tz = "0.10.3"
urlencoding = "2.1.3"
serde_json = "1.0.140"
convert_case = "0.8.0"
serde = { version = "1.0.219", features = ["derive"] }
serde-hjson = "1.1.0"
wasi = "0.13.1"
futures = "0.3"
url = "2.5.4"
log = "0.4"
html2text = "0.17.1"

[package.metadata.component]
package = "component:mstd-wsj-rss"
